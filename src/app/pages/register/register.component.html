<div class="register-container">
  <div class="register-card">

    <img 
      src="../../../assets/images/LOGO.svg"
      class="logo-image"
      alt="CTRL+F Logo"
      (error)="onImageError($event)"
    />

    <h2 class="subtitle">Criar uma conta</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="input-row">
        <input type="text" formControlName="name" placeholder="Nome">
      </div>

      <div class="input-row">
        <input type="email" formControlName="email" placeholder="E-mail">
      </div>

      <div class="input-row">
        <input type="text" formControlName="cpf" placeholder="CPF">
      </div>

      <div class="input-row">
        <input type="text" formControlName="cellphoneNumber" placeholder="Telefone">
      </div>

      <div class="input-row">
        <input type="password" formControlName="password" placeholder="Senha">
      </div>

      <div class="input-row">
        <input type="password" formControlName="confirmPassword" placeholder="Confirmar senha">
      </div>

      <label class="terms-checkbox">
        <input type="checkbox" formControlName="terms" />
        <span>Aceito os <a href="#">Termos e Condições</a></span>
      </label>

      <button type="submit" class="register-btn" [disabled]="!registerForm.valid || loading">
        {{ loading ? 'CADASTRANDO...' : 'CADASTRAR' }}
      </button>

    </form>

    <p class="login-text">
      Já tem uma conta? <a routerLink="/login">Login</a>
    </p>

  </div>
</div>
