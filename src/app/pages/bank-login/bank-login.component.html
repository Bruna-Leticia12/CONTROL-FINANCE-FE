<div class="bank-login-container">
    <div class="bank-login-card">
        <!-- Header com cor do banco -->
        <div class="bank-header">
            <div class="bank-logo">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"
                        fill="currentColor" />
                </svg>
            </div>
            <h1 class="bank-name">{{ bankTheme.name }}</h1>
            <p class="bank-subtitle">Autenticação Open Finance</p>
        </div>

        <!-- Formulário -->
        <form class="login-form" (ngSubmit)="onSubmit()">
            <div class="info-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"
                        fill="currentColor" />
                </svg>
                <p>O <strong>Control Finance</strong> solicita acesso aos seus dados bancários</p>
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" [(ngModel)]="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14"
                    [disabled]="isLoading" required />
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" [(ngModel)]="password" name="password"
                    placeholder="Digite sua senha" [disabled]="isLoading" required />
            </div>

            <div class="error-message" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-login" [disabled]="isLoading || !cpf || !password">
                    <span *ngIf="!isLoading">Autorizar e Continuar</span>
                    <span *ngIf="isLoading" class="loading-spinner">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" stroke-dasharray="60"
                                stroke-dashoffset="40" opacity="0.3" />
                        </svg>
                        Autenticando...
                    </span>
                </button>

                <button type="button" class="btn-cancel" (click)="onCancel()" [disabled]="isLoading">
                    Cancelar
                </button>
            </div>
        </form>

        <!-- Informações de segurança -->
        <div class="security-footer">
            <div class="security-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"
                        fill="currentColor" />
                </svg>
                Conexão segura e criptografada
            </div>
        </div>
    </div>
</div>
