<div class="dialog-container">
  <p class="dialog-message">
    Ao continuar você permite o compartilhamento de dados via
    <strong>Open Finance</strong>.
  </p>

  <div class="input-container">
    <input
      type="password"
      [(ngModel)]="password"
      placeholder="Informe sua senha"
      class="password-input"
    />
  </div>

  <div class="dialog-actions">
    <button
      class="btn-allow"
      [disabled]="!password.trim()"
      (click)="onAllow()"
    >
      Permitir
    </button>
    <button class="btn-deny" (click)="onDeny()">Não permitir</button>
  </div>
</div>
