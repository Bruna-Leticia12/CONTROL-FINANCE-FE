<div class="chat-window" *ngIf="isChatOpen">
  
  <div class="chat-header">
    <div class="chat-title">
      FinCoach
    </div>
    <button mat-icon-button (click)="toggleChat()" class="close-button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="chat-history" #chatHistory>
    <div *ngFor="let msg of mensagens" class="chat-message" [ngClass]="{ 'user-message': msg.de === 'user', 'ia-message': msg.de === 'ia' }">
      <p>{{ msg.texto }}</p>
    </div>
    <div *ngIf="isLoading" class="loading-spinner">
      <mat-spinner diameter="30"></mat-spinner>
    </div>
  </div>

  <div class="chat-input-area">
    <mat-form-field class="full-width" >
      <mat-label>Como posso te ajudar?</mat-label>
      <input matInput 
             [(ngModel)]="novoPrompt" 
             (keyup.enter)="enviarMensagem()"
             [disabled]="isLoading">
    </mat-form-field>
    <button mat-icon-button color="primary" (click)="enviarMensagem()" [disabled]="isLoading || !novoPrompt">
      <mat-icon>send</mat-icon>
    </button>
  </div>

</div> <button mat-fab color="primary" (click)="toggleChat()" class="chat-fab-button" aria-label="Abrir assistente de IA">
  <mat-icon *ngIf="!isChatOpen">smart_toy</mat-icon>
  <mat-icon *ngIf="isChatOpen">close</mat-icon> 
</button>
