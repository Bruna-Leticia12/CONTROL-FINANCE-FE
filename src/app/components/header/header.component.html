<header class="app-header">
  <div class="header-inner">
    <div class="logo">
      <img src="assets/images/LOGO.svg" alt="CTRL+F" (error)="hideImage($event)" />
    </div>

    <div class="right-area">
      <div class="last-update">Última atualização: 12:00h</div>

      <div class="user-menu" *ngIf="showUserMenu">
        <button class="user-btn" (click)="toggleMenu()">
          {{ userName }}
          <span class="caret">▾</span>
        </button>

        <div class="dropdown" [class.open]="menuOpen">
          <button *ngFor="let item of filteredMenuItems" (click)="navigate(item.path)">
            {{ item.label }}
          </button>
          <button class="logout-btn" (click)="logout()">SAIR</button>
        </div>
      </div>
    </div>
  </div>
</header>
